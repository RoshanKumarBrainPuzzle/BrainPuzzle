<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RK Gaming - Wood Screw Puzzle 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#b87938;color:#5b2b0d;touch-action:manipulation}#view{position:absolute;inset:0}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:0;left:0;right:0;height:145px;padding:15px 17px 12px;background:linear-gradient(180deg,#d99a4d 0%,#bd7832 100%);border-bottom:5px solid #94501e;box-shadow:0 4px 10px #542b1540;display:grid;grid-template-columns:56px 1fr 112px;gap:10px;align-items:center}.pause{width:52px;height:52px;border-radius:14px;border:3px solid #8b4c21;background:linear-gradient(#ffe0a0,#c88a43);color:#6b3515;font-size:26px;font-weight:900;box-shadow:inset 0 2px 3px #fff8}.center{text-align:center}.brand{font-size:10px;font-weight:900;letter-spacing:2px;color:#703411}.level{font-size:27px;font-weight:1000;color:#733616;text-shadow:0 2px #f7c77e}.dots{color:#3bbd20;font-size:23px;letter-spacing:5px;line-height:20px}.timer{display:inline-block;margin-top:5px;background:#873509;color:#ffe1a0;border:3px solid #9a5426;border-radius:18px;padding:3px 18px;font-size:25px;font-weight:900;box-shadow:inset 0 3px 6px #542000}.stats{display:grid;gap:8px}.stat{background:#803305;color:#ffe0a0;border:3px solid #a35c27;border-radius:16px;text-align:center;padding:4px 6px;font-size:23px;font-weight:900;box-shadow:inset 0 3px 5px #4b1e08}.stat small{display:block;font-size:10px;letter-spacing:1px}.bottom{position:absolute;bottom:0;left:0;right:0;padding:18px 16px 25px;background:linear-gradient(180deg,#d59a52,#b87532);border-top:5px solid #94501e;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.tool{height:76px;border-radius:17px;border:4px solid #92501f;background:linear-gradient(#ffe1a3,#c88b47);color:#713715;font-size:28px;font-weight:1000;box-shadow:inset 0 3px 5px #fff8,0 4px 6px #4c260b55}.tool:active,.pause:active{transform:translateY(2px)}.tool.primary{background:linear-gradient(#ffe6b3,#d9a05a)}.hint{position:absolute;top:155px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#793407e8;color:#ffe4b3;border:2px solid #a76430;border-radius:22px;padding:7px 15px;font-size:12px;font-weight:700}.overlay{display:none;position:absolute;inset:0;background:#281307a8;align-items:center;justify-content:center;padding:25px}.dialog{width:100%;max-width:340px;background:linear-gradient(#e6b46f,#c7833c);border:4px solid #844319;border-radius:22px;padding:22px;text-align:center;box-shadow:0 12px 30px #1c0d08aa}.dialog h2{color:#70310d;margin:0 0 8px}.dialog p{color:#572b13}.dialog button{width:100%;height:52px;border:3px solid #8c4b1e;border-radius:14px;background:linear-gradient(#ffe5ac,#c88b43);color:#68320e;font-weight:900;font-size:17px;margin-top:8px}
</style></head><body><div id="view"></div><header class="top"><button class="pause" id="pause">Ⅱ</button><div class="center"><div class="brand">RK GAMING</div><div class="level">LEVEL <span id="level">1</span></div><div class="dots" id="dots">● ●</div><div class="timer" id="timer">03:00</div></div><div class="stats"><div class="stat">⭐ <span id="stars">0</span><small>STARS</small></div><div class="stat">🪙 <span id="coins">0</span><small>COINS</small></div></div></header><div class="hint" id="hint">Tap the wooden screws to remove them</div><footer class="bottom"><button class="tool" id="undo" aria-label="Undo">↶</button><button class="tool" id="hintBtn" aria-label="Hint">💡</button><button class="tool primary" id="reset" aria-label="Restart">⟳</button></footer><div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">Level Complete!</h2><p id="dialogText">Great job!</p><button id="resume">Continue</button><button id="restart">Restart Level</button></div></div><script src="three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0xb87938);scene.fog=new THREE.Fog(0xb87938,15,28);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,80);camera.position.set(0,13.8,.01);camera.up.set(0,0,-1);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;$('view').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe3b4,0x74401d,2.1));const sun=new THREE.DirectionalLight(0xffe0ae,3.1);sun.position.set(-4,10,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);scene.add(new THREE.AmbientLight(0xffffff,.32));
function grain(base,streak){let c=document.createElement('canvas');c.width=512;c.height=128;let x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,512,128);for(let i=0;i<95;i++){x.globalAlpha=.05+Math.random()*.11;x.strokeStyle=i%2?streak:'#ffe0a0';x.lineWidth=1+Math.random()*3;x.beginPath();let y=Math.random()*128;x.moveTo(0,y);x.bezierCurveTo(130,y-12,330,y+12,512,y+(Math.random()-.5)*14);x.stroke()}x.globalAlpha=1;let t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,1);return t}
const woodTex=grain('#b8793e','#603219'),plankTex=grain('#925022','#4c260f'),blueTex=grain('#3978aa','#173d69'),greenTex=grain('#48a928','#205c13');const mat=(color,rough=.7,metal=0,map=null)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,map});const boardMat=mat(0xd49a52,.92,0,woodTex),brown=mat(0xffffff,.72,0,plankTex),blue=mat(0xffffff,.68,0,blueTex),green=mat(0xffffff,.68,0,greenTex),steel=mat(0x9b9b9b,.3,.82),holeMat=mat(0x3c2415,.9),rimMat=mat(0x8c5529,.48,.3),screwWood=mat(0xc99a58,.62),slotMat=mat(0x613813,.8);
const board=new THREE.Mesh(new THREE.BoxGeometry(8.3,.42,11),boardMat);board.position.y=-.55;board.receiveShadow=true;scene.add(board);
let level=1,stars=0,coins=0,remaining=0,parts=[],screws=[],time=180,timerId=null,paused=false,completed=false,history=[];
const patterns=[
[{x:0,z:-2.25,len:5.0,w:.68,angle:0,color:'brown',s:[-1.7,1.7]},{x:-1.65,z:-.75,len:2.35,w:.65,angle:0,color:'blue',s:[-.68,.68]},{x:.85,z:.75,len:3.9,w:.68,angle:.58,color:'green',s:[-1.35,1.35]},{x:0,z:2.05,len:5,w:.68,angle:0,color:'brown',s:[-1.7,0,1.7]},{x:1.75,z:2.9,len:2.25,w:.65,angle:0,color:'green',s:[-.65,.65]}],
[{x:0,z:-2.1,len:4.7,w:.7,angle:.18,color:'brown',s:[-1.55,1.55]},{x:-1.25,z:-.45,len:3.1,w:.66,angle:1.15,color:'blue',s:[-1,1]},{x:1.05,z:.65,len:3.7,w:.7,angle:-.65,color:'green',s:[-1.25,1.25]},{x:0,z:2.25,len:4.8,w:.7,angle:-.1,color:'brown',s:[-1.6,1.6]}],
[{x:0,z:-1.9,len:5,w:.7,angle:0,color:'brown',s:[-1.7,0,1.7]},{x:-1.55,z:.1,len:3.4,w:.65,angle:.3,color:'blue',s:[-1,1]},{x:1.1,z:.5,len:3.8,w:.7,angle:1.0,color:'green',s:[-1.2,1.2]},{x:0,z:2.35,len:4.7,w:.7,angle:0,color:'brown',s:[-1.6,1.6]}]
];
function hole(x,z){let g=new THREE.Group();g.position.set(x,-.30,z);let rim=new THREE.Mesh(new THREE.CylinderGeometry(.235,.235,.055,32),rimMat);rim.position.y=.02;g.add(rim);let inner=new THREE.Mesh(new THREE.CylinderGeometry(.175,.175,.06,32),holeMat);inner.position.y=.05;g.add(inner);scene.add(g)}
function makeScrew(x,z,parent){let g=new THREE.Group();g.position.set(x,.25,z);const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.075,.085,.46,20),steel);shaft.position.y=-.17;g.add(shaft);const head=new THREE.Mesh(new THREE.CylinderGeometry(.205,.19,.12,32),screwWood);head.position.y=.075;g.add(head);const rim=new THREE.Mesh(new THREE.TorusGeometry(.177,.018,8,32),mat(0x85501f,.55));rim.rotation.x=Math.PI/2;rim.position.y=.142;g.add(rim);const cut1=new THREE.Mesh(new THREE.BoxGeometry(.23,.025,.065),slotMat);cut1.position.y=.148;g.add(cut1);const cut2=cut1.clone();cut2.rotation.y=Math.PI/2;g.add(cut2);g.traverse(o=>{if(o.isMesh)o.castShadow=true});parent.add(g);g.userData={removed:false,parent};screws.push(g)}
function clearScene(){parts.forEach(p=>scene.remove(p.group));screws.forEach(s=>{if(s.parent)s.parent.remove(s)});parts=[];screws=[];history=[];remaining=0}
function build(){clearScene();completed=false;paused=false;$('overlay').style.display='none';const pattern=patterns[(level-1)%patterns.length];pattern.forEach((d,i)=>{let group=new THREE.Group();group.position.set(d.x,.04+i*.035,d.z);group.rotation.y=d.angle;let geometry=new THREE.BoxGeometry(d.len,.28,d.w);let mesh=new THREE.Mesh(geometry,d.color==='blue'?blue:d.color==='green'?green:brown);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);let edge= new THREE.Mesh(new THREE.BoxGeometry(d.len-.08,.018,d.w+.025),mat(0x4b2815,.8));edge.position.y=-.135;group.add(edge);scene.add(group);let p={group,need:d.s.length,done:0,falling:false};parts.push(p);d.s.forEach(sx=>{hole(d.x+Math.cos(d.angle)*sx,d.z-Math.sin(d.angle)*sx);makeScrew(sx,0,group)})});remaining=screws.length;$('level').textContent=level;$('stars').textContent=stars;$('coins').textContent=coins;$('hint').textContent='Tap the wooden screws to remove them';$('dots').textContent='● '.repeat(Math.min(3,level%4+1));time=180;updateTimer();startTimer()}
function updateTimer(){let m=Math.floor(time/60),s=time%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(paused||completed)return;time=Math.max(0,time-1);updateTimer();if(time===0){paused=true;showDialog('Time Up!','Try the level again.','Retry')}} ,1000)}
function showDialog(title,msg,button){$('dialogTitle').textContent=title;$('dialogText').textContent=msg;$('resume').textContent=button||'Continue';$('overlay').style.display='flex'}
function removeScrew(s){if(paused||completed||s.userData.removed)return;s.userData.removed=true;history.push(s);const p=parts.find(q=>q.group===s.userData.parent);p.done++;remaining--;s.parent.remove(s);coins+=1;$('coins').textContent=coins;$('hint').textContent='Nice! Keep removing the screws';if(p.done===p.need&&!p.falling){p.falling=true;let frame=0;const fall=()=>{frame++;p.group.position.y-=.045;p.group.rotation.z+=.008;if(frame<30)requestAnimationFrame(fall);else scene.remove(p.group)};fall()}if(remaining===0){completed=true;clearInterval(timerId);stars+=3;coins+=10;$('stars').textContent=stars;$('coins').textContent=coins;setTimeout(()=>showDialog('LEVEL '+level+' COMPLETE!','Amazing! +3 stars and +10 bonus coins.','Next Level'),500)}}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(paused||completed)return;let r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(screws.filter(s=>!s.userData.removed).flatMap(s=>s.children),true);if(hits.length){let o=hits[0].object;while(o.parent&&!screws.includes(o))o=o.parent;if(screws.includes(o))removeScrew(o)}});
$('pause').onclick=()=>{if(completed)return;paused=!paused;if(paused)showDialog('PAUSED','Take a break. Your level is saved.','Resume');else $('overlay').style.display='none'};
$('resume').onclick=()=>{if($('resume').textContent==='Next Level'){level++;build()}else if($('resume').textContent==='Retry'){build()}else{paused=false;$('overlay').style.display='none'}};
$('restart').onclick=()=>build();$('reset').onclick=()=>build();$('undo').onclick=()=>{if(paused||completed)return;build();$('hint').textContent='Level restarted'};$('hintBtn').onclick=()=>{if(paused||completed)return;let s=screws.find(q=>!q.userData.removed);if(s){s.scale.setScalar(1.5);setTimeout(()=>s.scale.setScalar(1),800);$('hint').textContent='Try this screw first!'}};
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}build();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
