<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RK Wood Screw Puzzle</title><style>
*{box-sizing:border-box}body{margin:0;background:#21160f;color:#fff0d4;font:16px system-ui;overflow:hidden}#view{position:absolute;inset:0}canvas{width:100%;height:100%;display:block}.head{position:absolute;top:18px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #000}.head small{display:block;font-size:10px;letter-spacing:3px;color:#e6b66a}.panel{position:absolute;bottom:20px;left:14px;right:14px;background:#20150ee8;border:1px solid #96683b;border-radius:17px;padding:12px}.task{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}.task b{color:#e6b66a}.buttons{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}button{border:1px solid #bd8c51;border-radius:12px;padding:13px 5px;background:linear-gradient(#79502e,#4c2d1b);color:#fff0d4;font-weight:800;font-size:13px}button.primary{background:linear-gradient(#e7b768,#a76b2f);color:#2b1b10}.bar{height:5px;background:#fff3;border-radius:5px;margin:0 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:#e6b66a;width:0}.hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:12px;background:#21160fe8;border:1px solid #9b744a;padding:8px 14px;border-radius:20px;white-space:nowrap}.overlay{display:none;position:absolute;inset:0;background:#100a09d9;align-items:center;justify-content:center;padding:24px}.dialog{background:#3e2819;border:1px solid #d0a05c;border-radius:22px;padding:24px;text-align:center;width:100%;max-width:340px}.dialog h2{color:#f0c47b}.dialog button{width:100%;margin-top:12px}
</style></head><body><div id="view"></div><div class="head"><div>🔩 RK GAMING<small>WOOD SCREW PUZZLE 3D</small></div><div>LEVEL <span id="level">1</span><br><span id="count">0 / 6</span></div></div><div class="hint" id="hint">Tap a screw to remove it</div><div class="panel"><div class="task"><span id="task">🪵 Clear every wooden plank</span><b id="score">★ 0</b></div><div class="bar"><i id="progress"></i></div><div class="buttons"><button id="help">💡 Hint</button><button id="reset">↻ Reset</button><button class="primary" id="next">Next Level ➜</button></div></div><div class="overlay" id="overlay"><div class="dialog"><h2 id="title">Level Complete!</h2><p id="message">Great work!</p><button class="primary" id="continue">Continue ➜</button></div></div><script src="three.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x21160f);scene.fog=new THREE.Fog(0x21160f,11,22);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,7.5,10.8);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;$('view').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffdfb2,0x392114,2));const light=new THREE.DirectionalLight(0xffd29a,3);light.position.set(-4,9,7);light.castShadow=true;scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,.25));const M=(c,r=.65,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}),woods=[M(0x9b5d2d),M(0xb8793c),M(0x75401f),M(0xc18a4d)],steel=M(0xb9c2c8,.28,.8),dark=M(0x342016),gold=M(0xd9a34e,.3,.6);const base=new THREE.Mesh(new THREE.BoxGeometry(5.8,.35,5.8),M(0x54321d));base.position.y=-.6;base.receiveShadow=true;scene.add(base);const layouts=[[[-1.2,-1.1,4.2,.82,2],[0,0,4.2,.82,2],[1.2,1.1,4.2,.82,2]],[[-1,0,3.7,.8,2],[0,0,3.7,.8,2],[1,0,3.7,.8,2]], [[-1.2,-1.2,4,.7,3],[0,0,3.8,.7,2],[1.2,1.2,3.8,.7,3]]];let level=1,score=0,removed=0,planks=[],screws=[],locked=false;function clear(){planks.forEach(p=>scene.remove(p.g));screws.forEach(s=>s.parent&&s.parent.remove(s));planks=[];screws=[];removed=0}function screw(x,parent){let g=new THREE.Group();g.position.set(x,.2,0);let shaft=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.42,16),dark);shaft.position.y=-.12;g.add(shaft);let head=new THREE.Mesh(new THREE.CylinderGeometry(.18,.16,.12,24),steel);head.position.y=.12;g.add(head);let slot=new THREE.Mesh(new THREE.BoxGeometry(.2,.025,.035),dark);slot.position.y=.19;g.add(slot);let slot2=slot.clone();slot2.rotation.y=Math.PI/2;g.add(slot2);g.traverse(o=>{if(o.isMesh)o.castShadow=true});parent.add(g);g.userData={gone:false,parent};screws.push(g)}function build(){clear();locked=false;let data=layouts[Math.min(2,Math.floor((level-1)/3))];data.forEach((d,i)=>{let g=new THREE.Group();g.position.set(0,.02+i*.01,d[1]);g.rotation.y=(i%2?-.08:.08);let plank=new THREE.Mesh(new THREE.BoxGeometry(d[2],.34,d[3]),woods[(i+level)%4]);plank.castShadow=true;plank.receiveShadow=true;g.add(plank);for(let j=0;j<3;j++){let line=new THREE.Mesh(new THREE.BoxGeometry(d[2]*.8,.006,.012),M(0x59341b));line.position.set(0,.174,(j-1)*d[3]*.2);g.add(line)}scene.add(g);planks.push({g,need:d[4],done:0});for(let j=0;j<d[4];j++)screw((j/(d[4]-1||1)-.5)*d[2]*.72,g)});$('level').textContent=level;$('count').textContent='0 / '+screws.length;$('score').textContent='★ '+score;$('progress').style.width='0%';$('hint').textContent='Tap a screw to remove it';camera.position.set(0,7.5,10.8);camera.lookAt(0,0,0)}function win(){locked=true;$('title').textContent='Level '+level+' Complete!';$('message').textContent='Great job! You earned '+level*10+' points.';$('overlay').style.display='flex'}function remove(s){if(locked||s.userData.gone)return;s.userData.gone=true;let p=planks.find(p=>p.g===s.userData.parent);if(p){p.done++;if(p.done===p.need){let t=0,from=p.g.position.y;function fall(){t+=.08;p.g.position.y=from-1.5*Math.min(t,1);p.g.rotation.x+=.015;if(t<1)requestAnimationFrame(fall)}fall()}}s.parent.remove(s);removed++;$('count').textContent=removed+' / '+screws.length;$('progress').style.width=(removed/screws.length*100)+'%';if(removed===screws.length){score+=level*10;$('score').textContent='★ '+score;setTimeout(win,600)}}const ray=new THREE.Raycaster(),pt=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(locked)return;let r=renderer.domElement.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(pt,camera);let hit=ray.intersectObjects(screws.filter(s=>!s.userData.gone).flatMap(s=>s.children),true)[0];if(hit){let o=hit.object;while(o.parent&&!screws.includes(o))o=o.parent;if(screws.includes(o))remove(o)}});$('help').onclick=()=>{let s=screws.find(s=>!s.userData.gone);if(s){s.scale.setScalar(1.4);setTimeout(()=>s.scale.setScalar(1),900);$('hint').textContent='✨ Remove the glowing screw';setTimeout(()=>$('hint').textContent='Tap a screw to remove it',1300)}};$('reset').onclick=()=>{$('overlay').style.display='none';build()};function next(){level++;$('overlay').style.display='none';build()}$('continue').onclick=next;$('next').onclick=()=>removed===screws.length?next():($('hint').textContent='Clear this level first!');function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}build();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
