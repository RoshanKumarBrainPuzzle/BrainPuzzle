<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RK Gaming - Wood Screw Puzzle 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#eadbb9;color:#5b2b0d;touch-action:manipulation}#view{position:absolute;inset:0}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:0;left:0;right:0;height:166px;padding:10px 12px 8px;background:linear-gradient(#f1d59e,#d6a35c);border-bottom:4px solid #a86c2e;box-shadow:0 3px 9px #67401f45}.toprow{display:flex;align-items:center;justify-content:space-between}.pause{width:36px;height:34px;border:2px solid #a16a31;border-radius:9px;background:#f9dfaa;color:#7a421b;font-size:20px;font-weight:900}.level{font-size:18px;font-weight:1000;color:#5d3015;text-shadow:0 1px #fff0c8}.star{background:#6b3516;color:#ffdf9a;border-radius:12px;padding:5px 10px;font-weight:900}.trays{display:flex;gap:7px;margin-top:8px;align-items:center}.tray{height:54px;flex:1;max-width:82px;border:3px solid #8e6438;border-radius:16px;background:#f9edce;display:flex;align-items:center;justify-content:space-evenly;box-shadow:inset 0 3px 5px #8c5a2b35;position:relative}.tray.plus{background:#f2c65a;border-color:#a87627;color:#7a4318;font-size:29px;font-weight:900}.tray .slot{width:17px;height:17px;border-radius:50%;background:#aeb2b4;border:2px solid #e5e5dd;box-shadow:inset 0 2px 3px #5555}.tray .slot.filled{background:var(--traycolor);border-color:#fff3;box-shadow:0 1px 2px #0004}.progress{display:flex;justify-content:center;gap:6px;margin-top:7px}.progress span{width:10px;height:10px;border-radius:50%;background:#a9a9a0;border:1px solid #eee2c6}.progress span.done{background:#67bf38;border-color:#4e942a}.percent{position:absolute;right:12px;bottom:8px;font-size:11px;font-weight:800;color:#724018}.hint{position:absolute;top:174px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#7a3d16e8;color:#ffe7b7;border:2px solid #b17b42;border-radius:20px;padding:6px 13px;font-size:11px;font-weight:700}.bottom{position:absolute;bottom:0;left:0;right:0;padding:13px 14px 22px;background:linear-gradient(#e6bd7c,#d09a52);border-top:4px solid #a86c2e;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool{height:62px;border-radius:13px;border:3px solid #b17b36;background:linear-gradient(#ffe49c,#e4b64f);color:#713715;font-size:25px;font-weight:1000;box-shadow:inset 0 2px 4px #fff8,0 3px 5px #5c310f33}.tool small{display:block;font-size:9px;line-height:9px}.overlay{display:none;position:absolute;inset:0;background:#291507a8;align-items:center;justify-content:center;padding:24px}.dialog{width:100%;max-width:330px;background:linear-gradient(#f3d59c,#d6a35c);border:4px solid #91501f;border-radius:22px;padding:22px;text-align:center;box-shadow:0 12px 30px #1c0d08aa}.dialog h2{color:#71350f;margin:0 0 8px}.dialog p{color:#572b13}.dialog button{width:100%;height:50px;border:3px solid #8c4b1e;border-radius:14px;background:linear-gradient(#ffe5ac,#c88b43);color:#68320e;font-weight:900;font-size:17px;margin-top:8px}
</style></head><body><div id="view"></div><header class="top"><div class="toprow"><button class="pause" id="pause">Ⅱ</button><div class="level">LEVEL <span id="level">1</span></div><div class="star">⭐ <span id="stars">0</span></div></div><div class="trays" id="trays"></div><div class="progress" id="progress"></div><div class="percent" id="percent">0%</div></header><div class="hint" id="hint">Tap a screw to sort by color</div><footer class="bottom"><button class="tool" id="drill">🔧<small>DRILL</small></button><button class="tool" id="hammer">🔨<small>HAMMER</small></button><button class="tool" id="brush">🧹<small>BRUSH</small></button></footer><div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">Level Complete!</h2><p id="dialogText">Great job!</p><button id="resume">Continue</button><button id="restart">Restart Level</button></div></div><script src="three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0xeadbb9);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,80);camera.position.set(0,14,0);camera.up.set(0,0,-1);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;$('view').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe7c4,0x75502c,2.2));const sun=new THREE.DirectionalLight(0xffe0ae,3);sun.position.set(-4,10,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);scene.add(new THREE.AmbientLight(0xffffff,.25));
const colors=[{id:'orange',hex:0xef8a28,css:'#ef8a28'},{id:'blue',hex:0x347ee7,css:'#347ee7'},{id:'purple',hex:0x9b53d9,css:'#9b53d9'},{id:'green',hex:0x43b936,css:'#43b936'},{id:'pink',hex:0xe6538a,css:'#e6538a'},{id:'steel',hex:0x9299a2,css:'#9299a2'},{id:'brown',hex:0x88502d,css:'#88502d'}];const wood= new THREE.MeshStandardMaterial({color:0xd7a25c,roughness:.9}),boardMat=new THREE.MeshStandardMaterial({color:0xc68a46,roughness:.9}),slotMat=new THREE.MeshStandardMaterial({color:0x60401f,roughness:.85}),metal=new THREE.MeshStandardMaterial({color:0x999da0,metalness:.7,roughness:.3}),headM=new THREE.MeshStandardMaterial({color:0xd2a46a,roughness:.6}),black=new THREE.MeshStandardMaterial({color:0x4d301a,roughness:.8});
const base=new THREE.Mesh(new THREE.BoxGeometry(8.5,.35,11),wood);base.position.y=-.55;base.receiveShadow=true;scene.add(base);
let level=1,stars=0,parts=[],screws=[],trays=[],sorted=0,remaining=0,paused=false,finished=false,history=[],activeTool=null;
const layouts=[
[{x:-1.3,z:-2.5,w:1.1,h:2.4,a:0,c:1,n:3},{x:1.2,z:-2.1,w:1.1,h:2.5,a:.5,c:2,n:3},{x:-1.2,z:.2,w:1.25,h:2.7,a:-.5,c:3,n:3},{x:1.3,z:.2,w:1.25,h:2.7,a:0,c:4,n:3},{x:0,z:2.35,w:1.3,h:2.2,a:.2,c:0,n:3}],
[{x:-1.6,z:-2.4,w:1.1,h:3.1,a:0,c:1,n:3},{x:0,z:-1.6,w:1.25,h:3.4,a:.65,c:2,n:3},{x:1.6,z:-1.8,w:1.1,h:3.1,a:0,c:3,n:3},{x:-.8,z:1.2,w:1.25,h:3.2,a:-.4,c:4,n:3},{x:1,z:1.9,w:1.1,h:2.6,a:.3,c:0,n:3},{x:0,z:0,w:1.5,h:2.8,a:1.0,c:5,n:3}],
[{x:-1.5,z:-2.2,w:1.2,h:3.2,a:0,c:0,n:3},{x:0,z:-2,w:1.2,h:3.2,a:.5,c:2,n:3},{x:1.5,z:-2.2,w:1.2,h:3.2,a:0,c:3,n:3},{x:-1.5,z:1,w:1.2,h:3.2,a:.2,c:4,n:3},{x:0,z:1.2,w:1.2,h:3.2,a:-.6,c:1,n:3},{x:1.5,z:1,w:1.2,h:3.2,a:0,c:5,n:3},{x:0,z:0,w:1.4,h:3.8,a:.9,c:6,n:3}]
];
function roundedShape(w,h,r){let s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s}
function makeScrew(parent,x,z,color){let g=new THREE.Group();g.position.set(x,.23,z);const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.34,18),metal);shaft.position.y=-.13;g.add(shaft);const head=new THREE.Mesh(new THREE.CylinderGeometry(.19,.17,.12,24),new THREE.MeshStandardMaterial({color:color.hex,roughness:.35,metalness:.18}));head.position.y=.06;g.add(head);const cross=new THREE.Mesh(new THREE.BoxGeometry(.2,.025,.045),black);cross.position.y=.125;g.add(cross);const cross2=cross.clone();cross2.rotation.y=Math.PI/2;g.add(cross2);g.traverse(o=>{if(o.isMesh)o.castShadow=true});parent.add(g);g.userData={color:color.id,colorIndex:colors.indexOf(color),removed:false,parent};screws.push(g)}
function makeHole(x,z){let h=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.035,24),slotMat);h.position.set(x,-.32,z);scene.add(h)}
function clear(){parts.forEach(p=>scene.remove(p.group));screws.forEach(s=>s.parent&&s.parent.remove(s));trays=[];parts=[];screws=[];history=[];sorted=0}
function makeTrays(){let host=$('trays');host.innerHTML='';for(let i=0;i<2;i++){let el=document.createElement('div');el.className='tray';el.innerHTML='<span class="slot"></span><span class="slot"></span><span class="slot"></span>';host.appendChild(el);trays.push({color:null,count:0,el})}let plus=document.createElement('div');plus.className='tray plus';plus.textContent='+';plus.title='Extra tray slot';plus.onclick=()=>{$('hint').textContent='Extra tray slots are a future upgrade';setTimeout(()=>{$('hint').textContent='Tap a screw to sort by color'},1300)};host.appendChild(plus)}
function updateUI(){$('level').textContent=level;$('stars').textContent=stars;$('percent').textContent=Math.floor(sorted/screws.length*100)+'%';let p=$('progress');p.innerHTML='';for(let i=0;i<5;i++){let d=document.createElement('span');if(i<Math.floor(sorted/screws.length*5))d.className='done';p.appendChild(d)}trays.forEach(t=>{t.el.style.borderColor=t.color?colors.find(c=>c.id===t.color).css:'#8e6438';t.el.style.setProperty('--traycolor',t.color?colors.find(c=>c.id===t.color).css:'#aeb2b4');let slots=t.el.querySelectorAll('.slot');slots.forEach((s,i)=>s.classList.toggle('filled',i<t.count))})}
function build(){clear();paused=false;finished=false;activeTool=null;$('overlay').style.display='none';makeTrays();let data=layouts[(level-1)%layouts.length];data.forEach((d,i)=>{let group=new THREE.Group();group.position.set(d.x,.02+i*.025,d.z);group.rotation.y=d.a;let shape=roundedShape(d.w,d.h,.18);let geo=new THREE.ExtrudeGeometry(shape,{depth:.2,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.045,bevelThickness:.04});geo.rotateX(-Math.PI/2);let m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:colors[d.c].hex,transparent:true,opacity:.9,roughness:.65}));m.castShadow=true;m.receiveShadow=true;group.add(m);scene.add(group);let part={group,need:d.n,done:0,falling:false};parts.push(part);let coords=[[-.28,-.65],[.28,0],[-.28,.65]];coords.slice(0,d.n).forEach(([x,z])=>{makeHole(d.x+Math.cos(d.a)*x+Math.sin(d.a)*z,d.z-Math.sin(d.a)*x+Math.cos(d.a)*z);makeScrew(group,x,z,colors[d.c])})}); // Add a few screws of matching colors across overlapping pieces
remaining=screws.length;updateUI();$('hint').textContent='Tap screws to fill matching color trays'}
function completeTray(t){stars++;t.color=null;t.count=0;$('hint').textContent='Color set complete! +1 ⭐';updateUI()}
function lose(){paused=true;show('Tray full!','A tray has 3 screws but no matching set. Restart and plan your colors.','Retry')}
function tapScrew(s){if(paused||finished||s.userData.removed)return;let color=s.userData.color;let t=trays.find(q=>q.color===color&&q.count<3)||trays.find(q=>q.color===null);if(!t){lose();return}if(t.color===null)t.color=color;t.count++;s.userData.removed=true;history.push(s);s.parent.remove(s);sorted++;let p=parts.find(q=>q.group===s.userData.parent);if(p){p.done++;if(p.done>=p.need&&!p.falling){p.falling=true;let n=0;function fall(){n++;p.group.position.y-=.035;p.group.rotation.z+=.006;if(n<28)requestAnimationFrame(fall);else scene.remove(p.group)}fall()}}if(t.count===3)completeTray(t);updateUI();if(sorted===screws.length){finished=true;stars+=5;show('LEVEL '+level+' COMPLETE!','Great sorting! You earned 5 bonus stars.','Next Level')}}
function show(title,msg,btn){$('dialogTitle').textContent=title;$('dialogText').textContent=msg;$('resume').textContent=btn;$('overlay').style.display='flex'}
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(paused||finished)return;let r=renderer.domElement.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(pt,camera);let hits=ray.intersectObjects(screws.filter(s=>!s.userData.removed).flatMap(s=>s.children),true);if(hits.length){let o=hits[0].object;while(o.parent&&!screws.includes(o))o=o.parent;if(screws.includes(o))tapScrew(o)}});
$('pause').onclick=()=>{if(finished)return;paused=!paused;if(paused)show('PAUSED','Take a break.','Resume');else $('overlay').style.display='none'};
$('resume').onclick=()=>{let v=$('resume').textContent;if(v==='Next Level'){level++;build()}else if(v==='Retry'){build()}else{paused=false;$('overlay').style.display='none'}};
$('restart').onclick=()=>build();$('drill').onclick=()=>{if(paused||finished)return;activeTool='drill';$('hint').textContent='Drill: tap a screw to remove it';$('drill').style.transform='scale(.94)';setTimeout(()=>$('drill').style.transform='',250)};$('hammer').onclick=()=>{if(paused||finished)return;let t=trays.find(q=>q.count>0);if(t){t.count=0;t.color=null;updateUI();$('hint').textContent='Hammer cleared one tray'}else $('hint').textContent='Hammer: choose a filled tray first'};$('brush').onclick=()=>{if(paused||finished)return;let s=screws.find(q=>!q.userData.removed);if(s){s.scale.setScalar(1.4);setTimeout(()=>s.scale.setScalar(1),750);$('hint').textContent='Brush hint: try the glowing screw'}};
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}build();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
