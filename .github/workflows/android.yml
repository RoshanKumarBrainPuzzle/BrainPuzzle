name: Build Brain Puzzle APK

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'BrainPuzzle_RoshanKumar_v3_2.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Download and extract project
        run: |
          mkdir project
          unzip -q BrainPuzzle_RoshanKumar_v3_2.zip -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrainPuzzle-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
